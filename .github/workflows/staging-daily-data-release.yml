name: Staging Daily Data-Only Release
# Staging drill iteration: advance another verified full day.

on:
  push:
    branches:
      - test/auto-sync-staging-20261122
    paths:
      - .github/workflows/staging-daily-data-release.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staging-daily-data-release-20261122
  cancel-in-progress: false

jobs:
  prepare-next-day:
    if: github.repository == 'ucom5541-debug/farm-price-app' && github.ref == 'refs/heads/test/auto-sync-staging-20261122'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    outputs:
      main_sha: ${{ steps.refs.outputs.main_sha }}
      release_sha: ${{ steps.refs.outputs.release_sha }}
    env:
      DEPLOY_BRANCH: test/auto-sync-release-20261122
    steps:
      - name: Read-only checkout of staging source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Pin exact upstream and staging release commits
        id: refs
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "ucom5541-debug/farm-price-app"
          test "$GITHUB_REF" = "refs/heads/test/auto-sync-staging-20261122"
          test "$DEPLOY_BRANCH" = "test/auto-sync-release-20261122"
          test "$DEPLOY_BRANCH" != "main"
          git fetch origin refs/heads/main:refs/remotes/origin/main
          git fetch origin "refs/heads/$DEPLOY_BRANCH:refs/remotes/origin/$DEPLOY_BRANCH"
          echo "main_sha=$(git rev-parse refs/remotes/origin/main)" >> "$GITHUB_OUTPUT"
          echo "release_sha=$(git rev-parse refs/remotes/origin/$DEPLOY_BRANCH)" >> "$GITHUB_OUTPUT"
          test "$(git rev-parse refs/remotes/origin/$DEPLOY_BRANCH:server/server.js)" = "$(git rev-parse 3af46afc1972cc77d2331d35f2049259f6d582f4:server/server.js)"
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run current and future-day history gate tests
        run: |
          set -euo pipefail
          node --test server/daily-history-gate.test.mjs
          node --check server/staging-daily-release.mjs
      - name: Prepare strictly one complete next-day batch from pinned main
        env:
          EXPECTED_MAIN_SHA: ${{ steps.refs.outputs.main_sha }}
        run: |
          set -euo pipefail
          node server/staging-daily-release.mjs prepare "$RUNNER_TEMP/next-day-price-history.json"
      - name: Reject incomplete daily batch in isolated temporary Git commit
        env:
          EXPECTED_MAIN_SHA: ${{ steps.refs.outputs.main_sha }}
        shell: bash
        run: |
          set -euo pipefail
          git show "$EXPECTED_MAIN_SHA:server/price-history.json" > "$RUNNER_TEMP/upstream.json"
          git show "refs/remotes/origin/$DEPLOY_BRANCH:server/price-history.json" > "$RUNNER_TEMP/old.json"
          node --input-type=module - "$RUNNER_TEMP" <<'NODE'
          import fs from 'node:fs';
          const dir=process.argv[2];
          const old=JSON.parse(fs.readFileSync(dir+'/old.json'));
          const upstream=JSON.parse(fs.readFileSync(dir+'/upstream.json'));
          fs.writeFileSync(dir+'/partial.json',JSON.stringify(upstream.slice(0,old.length+9)));
          NODE
          blob=$(git hash-object -w "$RUNNER_TEMP/partial.json")
          export GIT_INDEX_FILE="$RUNNER_TEMP/negative-index"
          git read-tree "$EXPECTED_MAIN_SHA"
          git update-index --cacheinfo "100644,$blob,server/price-history.json"
          tree=$(git write-tree)
          bad=$(echo 'local negative test only' | git -c user.name=Test -c user.email=test@example.invalid commit-tree "$tree")
          unset GIT_INDEX_FILE
          if EXPECTED_MAIN_SHA="$bad" node server/staging-daily-release.mjs prepare "$RUNNER_TEMP/forbidden.json" > "$RUNNER_TEMP/reject.log" 2>&1; then
            echo "::error::Incomplete batch accepted"; exit 1
          fi
          grep -F 'Missing complete next-day batch' "$RUNNER_TEMP/reject.log"
          test ! -e "$RUNNER_TEMP/forbidden.json"
          echo 'PASS: incomplete batch rejected before artifact or push'
      - name: Upload validated staged history only
        uses: actions/upload-artifact@v4
        with:
          name: vetted-staging-history
          path: ${{ runner.temp }}/next-day-price-history.json
          if-no-files-found: error
          retention-days: 1

  publish-staging-only:
    needs: prepare-next-day
    if: github.repository == 'ucom5541-debug/farm-price-app' && github.ref == 'refs/heads/test/auto-sync-staging-20261122'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    env:
      DEPLOY_BRANCH: test/auto-sync-release-20261122
      EXPECTED_MAIN_SHA: ${{ needs.prepare-next-day.outputs.main_sha }}
      EXPECTED_RELEASE_SHA: ${{ needs.prepare-next-day.outputs.release_sha }}
    steps:
      - name: Check out only pinned staging release
        uses: actions/checkout@v4
        with:
          ref: test/auto-sync-release-20261122
          fetch-depth: 0
          persist-credentials: false
      - name: Download validated history artifact
        uses: actions/download-artifact@v4
        with:
          name: vetted-staging-history
          path: ${{ runner.temp }}/vetted-data
      - name: Recheck exact branch heads and history before writing
        shell: bash
        env:
          VETTED: ${{ runner.temp }}/vetted-data/next-day-price-history.json
        run: |
          set -euo pipefail
          test "$DEPLOY_BRANCH" = "test/auto-sync-release-20261122"
          test "$(git rev-parse HEAD)" = "$EXPECTED_RELEASE_SHA"
          git fetch origin refs/heads/main:refs/remotes/origin/main
          git fetch origin "refs/heads/$DEPLOY_BRANCH:refs/remotes/origin/$DEPLOY_BRANCH"
          test "$(git rev-parse refs/remotes/origin/$DEPLOY_BRANCH)" = "$EXPECTED_RELEASE_SHA"
          test "$(git rev-parse refs/remotes/origin/main)" = "$EXPECTED_MAIN_SHA" || {
            echo "::error::main advanced after collection; require a new reviewed run"
            exit 1
          }
          test "$(git rev-parse HEAD:server/server.js)" = "$(git rev-parse 3af46afc1972cc77d2331d35f2049259f6d582f4:server/server.js)"
          git show "$EXPECTED_MAIN_SHA:server/price-history.json" > "$RUNNER_TEMP/verified-upstream.json"
          node --input-type=module - "$VETTED" "$RUNNER_TEMP/verified-upstream.json" <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const [vetted, upstream] = process.argv.slice(2).map(p=>JSON.parse(fs.readFileSync(p,'utf8')));
          assert.ok(Array.isArray(vetted) && Array.isArray(upstream));
          assert.deepEqual(vetted,upstream.slice(0,vetted.length),'Data artifact is not a prefix of pinned main');
          NODE
          cp "$VETTED" "$RUNNER_TEMP/next-day-price-history.json"
          git show "$EXPECTED_MAIN_SHA:server/price-history.json" > "$RUNNER_TEMP/unused-main-history.json"
          cp "$VETTED" server/price-history.json
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import {execFileSync} from 'node:child_process';
          const original=JSON.parse(execFileSync('git',['show','HEAD:server/price-history.json'],{encoding:'utf8'}));
          const newer=JSON.parse(fs.readFileSync('server/price-history.json','utf8'));
          assert.equal(newer.length-original.length,10);
          assert.deepEqual(newer.slice(0,original.length),original);
          const rows=newer.slice(original.length);
          assert.equal(new Set(rows.map(x=>x.crop)).size,10);
          assert.equal(new Set(rows.map(x=>x.date)).size,1);
          NODE
          git add -- server/price-history.json
          git diff --cached --check
          test "$(git diff --cached --name-only)" = "server/price-history.json"
      - name: Commit and fast-forward staging release branch only
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$DEPLOY_BRANCH" = "test/auto-sync-release-20261122"
          test "$DEPLOY_BRANCH" != "main"
          test "$(git rev-parse HEAD)" = "$EXPECTED_RELEASE_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test: staging data-only next-day release"
          git -c 'credential.helper=!f() { echo username=x-access-token; echo password="$GH_TOKEN"; }; f' push origin "HEAD:refs/heads/$DEPLOY_BRANCH"

  verify-staging-api:
    needs: [prepare-next-day, publish-staging-only]
    if: github.repository == 'ucom5541-debug/farm-price-app' && github.ref == 'refs/heads/test/auto-sync-staging-20261122'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - name: Check out only the staging data release
        uses: actions/checkout@v4
        with:
          ref: test/auto-sync-release-20261122
          persist-credentials: false
      - name: Wait for Render then verify all 10 API histories against the release
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, time, urllib.request
          from pathlib import Path

          base='https://farm-price-auto-release-staging.onrender.com'
          assert base=='https://farm-price-auto-release-staging.onrender.com'
          assert base!='https://farm-price-app.onrender.com'
          history=json.loads(Path('server/price-history.json').read_text(encoding='utf-8'))
          crops=('shallot','kale','pakchoi','chili','coriander','cucumber','longbean','celery','morningglory','cabbage')
          expected_day=history[-1]['date']
          from datetime import datetime
          from zoneinfo import ZoneInfo
          def local_day(row):
              return datetime.fromisoformat(row['timestamp'].replace('Z','+00:00')).astimezone(ZoneInfo('Asia/Bangkok')).date().isoformat()
          # The API groups legacy and v3 events into one entry per crop/day.
          expected={crop:len({local_day(r) for r in history if r['crop']==crop}) for crop in crops}
          assert sum(r.get('date')==expected_day for r in history)==10, 'Release day is incomplete'
          assert {r['crop'] for r in history if r.get('date')==expected_day}==set(crops), 'Release crop mismatch'
          last_errors={}
          for attempt in range(30):
              last_errors={}
              for crop in crops:
                  try:
                      with urllib.request.urlopen(base+'/api/history?crop='+crop,timeout=20) as response:
                          assert response.status==200
                          data=json.load(response)
                      assert data.get('status')=='ok'
                      rows=data.get('data')
                      assert isinstance(rows,list)
                      assert data.get('count')==expected[crop]==len(rows), (crop,'count mismatch',data.get('count'),expected[crop])
                      assert rows and rows[-1].get('date')==expected_day, (crop,'day mismatch',rows[-1].get('date') if rows else None,expected_day)
                  except Exception as exc:
                      last_errors[crop]=str(exc)
              if not last_errors:
                  print('PASS: all ten Staging APIs match released history',expected_day,'total_history_records',len(history))
                  with open(os.environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf-8') as f:
                      f.write('### Staging history verification passed\n')
                      f.write('Date: '+expected_day+'; total records: '+str(len(history))+'; all ten crop counts matched.\n')
                  break
              if attempt<29:
                  print('Waiting for Staging deployment, attempt',attempt+1,'of 30; pending',','.join(last_errors.keys()))
                  time.sleep(8)
          else:
              print('STAGING API VERIFICATION FAILED:',json.dumps(last_errors,ensure_ascii=False))
              raise SystemExit(1)
          PY

  report-staging-failure:
    needs: [prepare-next-day, publish-staging-only, verify-staging-api]
    if: ${{ always() && (needs.prepare-next-day.result == 'failure' || needs.publish-staging-only.result == 'failure' || needs.verify-staging-api.result == 'failure') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Record a visible failure in GitHub Actions
        env:
          PREPARE_STATUS: ${{ needs.prepare-next-day.result }}
          PUBLISH_STATUS: ${{ needs.publish-staging-only.result }}
          VERIFY_STATUS: ${{ needs.verify-staging-api.result }}
        shell: bash
        run: |
          echo "### STAGING DATA SYNC FAILED — NO PRODUCTION ACTION" >> "$GITHUB_STEP_SUMMARY"
          echo "Prepare: $PREPARE_STATUS; publish: $PUBLISH_STATUS; verify: $VERIFY_STATUS" >> "$GITHUB_STEP_SUMMARY"
          echo "::error::Staging daily data release failed. Review the failed workflow steps. No Production deploy was requested."
          exit 1
